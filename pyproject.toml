[project]
name = "ichatbio-gbif-agent"
version = "0.1.0"
description = "An iChatBio agent that retrieves biodiversity data from GBIF."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ichatbio-sdk==0.2.8",
    "instructor>=1.17.0",
    "openai>=3.0.0",
    "pydantic==2.14.4",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "tenacity>=9.2.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-xdist>=3.8.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --import-mode=importlib"
asyncio_default_fixture_loop_scope = "function"
